name: Temporary format debug

on:
  push:
    branches:
      - di/feat/blocking-pwa-install-screen

jobs:
  format-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier tests/ui/app-shell.spec.js
