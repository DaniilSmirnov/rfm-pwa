name: PR101 format autofix

on:
  push:
    branches:
      - integration/radix-migration
    paths:
      - .github/workflows/pr101-format-autofix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/radix-migration
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format touched files
        run: |
          npx prettier --write \
            src/map/point-marker.js \
            tests/unit/point-marker.test.js \
            tests/ui/map-tools-popover.spec.js \
            tests/pwa/migration-safety.spec.js \
            tests/migration/main-to-branch.spec.js
      - name: Commit formatting and remove helper workflow
        run: |
          rm .github/workflows/pr101-format-autofix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/map/point-marker.js tests/unit/point-marker.test.js tests/ui/map-tools-popover.spec.js tests/pwa/migration-safety.spec.js tests/migration/main-to-branch.spec.js .github/workflows/pr101-format-autofix.yml
          git commit -m "style: format map UI changes"
          git push origin HEAD:integration/radix-migration
