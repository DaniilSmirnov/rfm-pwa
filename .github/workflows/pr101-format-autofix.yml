name: PR 101 format autofix

on:
  push:
    branches:
      - integration/radix-migration

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/radix-migration
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format
      - name: Commit formatting and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr101-format-autofix.yml
          git add .
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply prettier formatting"
          git push origin HEAD:integration/radix-migration
