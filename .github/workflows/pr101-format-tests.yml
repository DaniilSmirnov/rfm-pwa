name: PR101 format current tests

on:
  push:
    branches:
      - integration/radix-migration
    paths:
      - .github/workflows/pr101-format-tests.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/radix-migration
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write tests/ui/map-more-layout.spec.js tests/ui/race-flow.spec.js
      - name: Commit formatting and remove helper
        run: |
          rm .github/workflows/pr101-format-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ui/map-more-layout.spec.js tests/ui/race-flow.spec.js .github/workflows/pr101-format-tests.yml
          git commit -m "style: format updated map UI tests"
          git push origin HEAD:integration/radix-migration
