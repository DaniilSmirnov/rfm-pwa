name: Prettier debug
on:
  pull_request:
    branches: [develop]
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npx prettier src/views/MapView.jsx > /tmp/MapView.formatted.jsx
      - run: diff -u src/views/MapView.jsx /tmp/MapView.formatted.jsx || true
