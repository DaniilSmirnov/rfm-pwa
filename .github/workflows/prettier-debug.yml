name: Prettier debug
on:
  pull_request:
    branches: [develop]
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npx prettier tests/unit/react-components.test.jsx > /tmp/formatted.jsx
      - run: diff -u tests/unit/react-components.test.jsx /tmp/formatted.jsx || true
