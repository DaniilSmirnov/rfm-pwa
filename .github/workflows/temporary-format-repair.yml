name: Temporary format repair

on:
  push:
    branches: [fix/stabilize-develop-ci]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write "src/**/*.{js,jsx,mjs,css}" "tests/**/*.{js,jsx,mjs,css}"
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git diff --cached --quiet || git commit -m "style: format sources"
          git push
