name: Temporary exact format repair

on:
  push:
    branches: [fix/stabilize-develop-ci]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier@3.6.2 --write src/components/ScreenHeader.jsx src/views/MapView.jsx
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ScreenHeader.jsx src/views/MapView.jsx
          git diff --cached --quiet || git commit -m "style: format remaining CI files"
          git push
