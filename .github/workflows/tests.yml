name: Tests

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify centralized release metadata
        run: npm run version:check
      - name: Lint JavaScript and JSX
        run: npm run lint
      - name: Verify code formatting
        run: npm run format:check
      - name: Build production artifact
        run: npm run build
      - name: Verify deploy artifact allowlist
        run: node scripts/check-build.mjs
      - name: Run Vitest
        run: npm run test:unit

  ui:
    name: Playwright UI (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ui-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install chromium webkit
          else
            npx playwright install --with-deps chromium webkit
          fi
      - name: Run Playwright UI shard
        run: npx playwright test --shard=${{ matrix.shard }}/4
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  pwa:
    name: Service Worker E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm run test:pwa
      - name: Upload PWA report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-pwa-report
          path: playwright-report-pwa/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload PWA failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-pwa-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  migration:
    name: Main → branch migration E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install branch dependencies
        run: npm ci --no-audit --no-fund
      - name: Build branch artifact
        run: npm run build
      - name: Build current main artifact
        run: |
          rm -rf /tmp/rfm-main
          git fetch origin main:refs/remotes/origin/main
          git worktree add --detach /tmp/rfm-main origin/main
          cd /tmp/rfm-main
          npm ci --no-audit --no-fund
          npm run build
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Run real main-to-branch migration E2E
        run: npm run test:migration
      - name: Upload migration report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-migration-report
          path: playwright-report-migration/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload migration failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-migration-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
