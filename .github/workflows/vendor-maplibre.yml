name: Vendor MapLibre 6.10.0

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/vendor-maplibre.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Fetch official npm package
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf vendor/maplibre /tmp/maplibre-package
          mkdir -p vendor/maplibre /tmp/maplibre-package
          npm pack maplibre-gl@6.10.0 --pack-destination /tmp/maplibre-package
          tar -xzf /tmp/maplibre-package/maplibre-gl-6.10.0.tgz -C /tmp/maplibre-package

          cp /tmp/maplibre-package/package/dist/maplibre-gl.mjs vendor/maplibre/
          cp /tmp/maplibre-package/package/dist/maplibre-gl-worker.mjs vendor/maplibre/
          cp /tmp/maplibre-package/package/dist/maplibre-gl-shared.mjs vendor/maplibre/
          cp /tmp/maplibre-package/package/dist/maplibre-gl.css vendor/maplibre/
          cp /tmp/maplibre-package/package/LICENSE.txt vendor/maplibre/

          cat > vendor/maplibre/README.md <<'EOF'
          # MapLibre GL JS 6.10.0

          Vendored from the official npm package maplibre-gl@6.10.0.
          Source: https://github.com/maplibre/maplibre-gl-js
          License: BSD-3-Clause.
          EOF

      - name: Commit vendored runtime
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/maplibre
          if git diff --cached --quiet; then
            echo "No vendor changes"
            exit 0
          fi
          git commit -m "Vendor MapLibre GL JS 6.10.0"
          git push origin HEAD:develop
