<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f5f5f5" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <script>
    (() => {
      const nav = navigator;
      let savedTheme = null;
      try { savedTheme = localStorage.getItem('rfm-theme-v1'); } catch {}
      const theme = savedTheme === 'light' || savedTheme === 'dark'
        ? savedTheme
        : (window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#111318' : '#f5f5f5');
      const ios = /iPhone|iPad|iPod/i.test(nav.userAgent)
        || (nav.platform === 'MacIntel' && nav.maxTouchPoints > 1);
      const standalone = nav.standalone === true
        || window.matchMedia?.('(display-mode: standalone)').matches
        || window.matchMedia?.('(display-mode: fullscreen)').matches;
      document.documentElement.dataset.ios = ios ? 'true' : 'false';
      document.documentElement.dataset.standalone = standalone ? 'true' : 'false';
    })();
  </script>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/rfm/icon.png?v=__APP_VERSION_CACHE__" />
  <link rel="stylesheet" href="/vendor/maplibre-gl/maplibre-gl.css" />
  <link rel="stylesheet" href="/src/styles.css" />
  <title>Rally Fans Map Offline</title>
</head>
<body>
  <div id="reactRoot"></div>
  <script src="/vendor/pmtiles/pmtiles.js"></script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
